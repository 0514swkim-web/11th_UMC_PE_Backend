<!-- 5주차 실습 0: CORS 에러를 눈으로 확인하는 간이 프론트 -->
<!-- 실행: 이 폴더에서 npx serve -l 5173 → http://localhost:5173 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>간이 프론트</title>
  </head>
  <body>
    <h1>간이 프론트 : 닉네임 중복 체크</h1>
    <button onclick="checkNickname()">'noco'으로 중복 체크</button>
    <p id="result"></p>

    <script>
      async function checkNickname() {
        // Spring 서버(8080). CORS 설정 전에는 Console에 CORS 에러가 뜬다.
        const res = await fetch("http://localhost:8080/members/nickname/noco");
        const data = await res.json();
        document.getElementById("result").innerText = JSON.stringify(data);
      }
    </script>
  </body>
</html>

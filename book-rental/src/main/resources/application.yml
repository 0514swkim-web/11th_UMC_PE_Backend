spring:
  application:
    name: "umc-study"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # IntelliJ 실행 구성 → 환경 변수에 등록 (비밀번호를 코드에 쓰지 않기 위해)
    # DB_URL=jdbc:mysql://localhost:3306/umc_study
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
  jpa:
    hibernate:
      # 이미 만든 테이블을 쓰므로 바꾸지 않고, 엔티티와 테이블 구조가 맞는지만 검사
      ddl-auto: validate
    open-in-view: false
    # 학습용: ORM이 실제로 실행하는 SQL을 콘솔에서 확인
    show-sql: true
    properties:
      hibernate:
        format_sql: true

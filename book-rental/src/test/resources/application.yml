# 테스트 전용 설정: 실제 MySQL 대신 메모리 DB에 2주차 스키마·더미 데이터를 넣고 시작
spring:
  datasource:
    driver-class-name: org.h2.Driver
    # 테스트 컨텍스트마다 새 DB (스키마가 두 번 생성되지 않게)
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # H2와 MySQL의 컬럼 타입 이름이 달라 테스트에서는 구조 검사를 끔 (실제 MySQL에서는 validate)
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
